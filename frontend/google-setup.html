<!DOCTYPE html>
<html>
<head>
  <title>Setup 2FA</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <h2>Setup Two-Factor Authentication</h2>
    <p id="qrNote">Scan this QR code with your authenticator app, then enter the code below</p>
    
    <div style="text-align: center; margin: 20px 0;">
      <img id="qrCode" alt="QR Code">
    </div>
    
    <form id="verifyForm">
      <div class="form-group">
        <label for="token">Verification Code</label>
        <input type="text" id="token" placeholder="Enter 6-digit code" maxlength="6" required>
      </div>
      <button type="submit">Verify & Complete Setup</button>
    </form>
    
    <div id="result"></div>
  </div>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const userId = urlParams.get("userId");
    const qr = urlParams.get("qr");
    
    if (qr) {
      document.getElementById("qrCode").src = qr;
    }

    document.getElementById("verifyForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      
      const token = document.getElementById("token").value;
      
      const res = await fetch("/api/auth/verify-2fa", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ userId, token })
      });
      
      const data = await res.json();
      
      if (!res.ok) {
        document.getElementById("result").innerHTML = 
          '<p style="color: red;">' + (data.message || "Invalid code") + '</p>';
        return;
      }
      
      localStorage.setItem("token", data.token);
      localStorage.setItem("role", data.role);
      alert("2FA setup complete!");
      
      const pages = { admin: "admin.html", manager: "manager.html", user: "user.html" };
      window.location.href = pages[data.role] || "user.html";
    });
  </script>
</body>
</html>
