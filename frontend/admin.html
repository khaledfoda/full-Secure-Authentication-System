<!DOCTYPE html>
<html>
<head>
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="dashboard-container">
    <div class="dashboard-header">
      <h2>Admin Dashboard</h2>
    </div>
    
    <div class="user-info">
      <p><strong>User ID:</strong> <span id="userData"></span></p>
      <p><strong>Role:</strong> <span id="userRole"></span></p>
    </div>
    
    <div class="buttons-row">
      <button onclick="window.location.href='admin-panel.html'">Manage Documents</button>
      <button onclick="window.location.href='user-management.html'">User Management</button>
      <button onclick="window.location.href='profile.html'">Profile</button>
      <button class="secondary" onclick="logout()">Logout</button>
    </div>
  </div>

  <script>
  const token = localStorage.getItem("token");
  const userId = localStorage.getItem("userId");
  const role = localStorage.getItem("role");

  if (!token || role !== "admin") {
    window.location.href = "login.html";
  } else {
    document.getElementById("userData").textContent = userId || "Not found";
    document.getElementById("userRole").textContent = role;
  }

  function logout() {
    localStorage.removeItem("token");
    localStorage.removeItem("userId");
    localStorage.removeItem("role");
    window.location.href = "login.html";
  }
  </script>
</body>
</html>
