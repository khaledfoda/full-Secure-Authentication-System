<!DOCTYPE html>
<html>
<head>
  <title>Upload Document</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .upload-area {
      border: 2px dashed #ccc;
      border-radius: 10px;
      padding: 40px;
      text-align: center;
      transition: all 0.3s;
      cursor: pointer;
      margin: 20px 0;
    }
    .upload-area:hover {
      border-color: #11998e;
      background: #f8fcfb;
    }
    .upload-icon {
      font-size: 48px;
      color: #11998e;
      margin-bottom: 15px;
    }
    .upload-text {
      color: #666;
      margin-bottom: 10px;
    }
    .file-info {
      color: #11998e;
      font-weight: bold;
      margin-top: 10px;
    }
    input[type="file"] {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Upload Document</h2>
    <form id="uploadForm">
      <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
        <div class="upload-icon">⬆</div>
        <div class="upload-text">Click to select a file or drag and drop here</div>
        <div style="color: #999; font-size: 12px;">Supported: PDF, DOCX, PPT, PPTX (Max 5MB)</div>
        <div id="fileName" class="file-info" style="display: none;"></div>
      </div>
      <input type="file" id="fileInput" accept=".pdf,.docx,.ppt,.pptx">
      <button type="submit" id="submitBtn" style="margin-top: 20px; width: 100%;">Upload & Encrypt</button>
    </form>
    <div id="result" style="margin-top: 20px;"></div>
    <p class="link">
      <a href="documents.html">View Documents</a> | 
      <a href="#" id="dashboardLink">Dashboard</a>
    </p>
  </div>
  <script>
    const token = localStorage.getItem("token");
    const role = localStorage.getItem("role");
    if (!token) {
      window.location.href = "login.html";
    }
    const dashboards = { admin: "admin.html", manager: "manager.html", user: "user.html" };
    document.getElementById("dashboardLink").href = dashboards[role] || "user.html";

    const fileInput = document.getElementById("fileInput");
    const fileName = document.getElementById("fileName");

    fileInput.addEventListener("change", function() {
      if (this.files && this.files[0]) {
        fileName.textContent = "Selected: " + this.files[0].name;
        fileName.style.display = "block";
      }
    });

    document.getElementById("uploadForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      
      const maxSize = 5 * 1024 * 1024;
      
      if (!fileInput.files[0]) {
        document.getElementById("result").innerHTML = '<p style="color: red;">Please select a file</p>';
        return;
      }

      const ext = fileInput.files[0].name.split('.').pop().toLowerCase();
      const allowedExts = ["pdf", "docx", "ppt", "pptx"];
      
      if (!allowedExts.includes(ext)) {
        document.getElementById("result").innerHTML = '<p style="color: red;">Only PDF, DOCX, PPT, PPTX files are allowed</p>';
        return;
      }

      if (fileInput.files[0].size > maxSize) {
        document.getElementById("result").innerHTML = '<p style="color: red;">File size must be less than 5MB</p>';
        return;
      }

      const formData = new FormData();
      formData.append("file", fileInput.files[0]);

      const submitBtn = document.getElementById("submitBtn");
      submitBtn.disabled = true;
      submitBtn.textContent = "Uploading...";

      try {
        const response = await fetch("/api/documents/upload", {
          method: "POST",
          headers: { "Authorization": `Bearer ${token}` },
          body: formData
        });

        const data = await response.json();

        if (!response.ok) {
          document.getElementById("result").innerHTML = `<p style="color: red;">Error: ${data.message || data.error || "Upload failed"}</p>`;
        } else {
          document.getElementById("result").innerHTML = `
            <div class="user-info">
              <p><strong>File:</strong> ${data.originalName}</p>
              <p><strong>Document ID:</strong> ${data.documentId}</p>
              <p><strong>Hash (SHA-256):</strong></p>
              <code style="word-break: break-all; font-size: 11px;">${data.hash}</code>
              <p style="color: #11998e; margin-top: 15px;">File encrypted and stored successfully!</p>
            </div>
          `;
          fileInput.value = "";
          fileName.style.display = "none";
        }
      } catch (error) {
        document.getElementById("result").innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
      }

      submitBtn.disabled = false;
      submitBtn.textContent = "Upload & Encrypt";
    });
  </script>
</body>
</html>
