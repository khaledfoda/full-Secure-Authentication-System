<!DOCTYPE html>
<html>
<head>
  <title>Upload Document</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <h2>Upload Document</h2>
    <form id="uploadForm">
      <div class="form-group">
        <label for="file">Select File</label>
        <input type="file" id="file" required>
      </div>
      <button type="submit">Upload & Encrypt</button>
    </form>
    <div id="result" style="margin-top: 20px;"></div>
    <p class="link"><a href="documents.html">View Documents</a></p>
  </div>
  <script>
    const token = localStorage.getItem("token");
    if (!token) {
      window.location.href = "login.html";
    }

    document.getElementById("uploadForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const fileInput = document.getElementById("file");
      const formData = new FormData();
      formData.append("file", fileInput.files[0]);

      const response = await fetch("/api/documents/upload", {
        method: "POST",
        headers: { "Authorization": `Bearer ${token}` },
        body: formData
      });

      const data = await response.json();
      document.getElementById("result").innerHTML = `
        <div class="user-info">
          <p><strong>File:</strong> ${data.originalName}</p>
          <p><strong>Hash (SHA-256):</strong> ${data.hash}</p>
          <p style="color: #11998e;">File encrypted and stored successfully!</p>
        </div>
      `;
    });
  </script>
</body>
</html>
