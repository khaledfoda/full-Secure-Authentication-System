<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <h2>Login</h2>
    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Enter your email" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" required>
      </div>
      <button type="submit">Login</button>
    </form>
    
    <div style="text-align: center; margin: 20px 0;">
      <span style="color: #999;">or</span>
    </div>
    
    <a href="/api/auth/google">
      <button type="button" class="secondary" style="background: #4285f4; color: white;">
        Login with Google
      </button>
    </a>
    
    <a href="/api/auth/github">
      <button type="button" class="secondary" style="background: #333; color: white;">
        Login with GitHub
      </button>
    </a>
    
    <p class="link">Don't have an account? <a href="register.html">Register</a></p>
  </div>
  <script src="js/login.js"></script>
</body>
</html>
