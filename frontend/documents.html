<!DOCTYPE html>
<html>
<head>
  <title>My Documents</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="dashboard-container">
    <div class="dashboard-header">
      <h2>My Documents</h2>
    </div>
    <table>
      <thead>
        <tr>
          <th>Filename</th>
          <th>Uploaded</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="documentsList"></tbody>
    </table>
    <div class="buttons-row">
      <button onclick="window.location.href='upload.html'">Upload New</button>
      <button onclick="window.location.href='verify.html'">Verify Documents</button>
      <button class="secondary" id="dashboardBtn">Dashboard</button>
      <button class="back-btn" onclick="window.location.href='login.html'">Logout</button>
    </div>
  </div>
  <script>
    const role = localStorage.getItem("role");
    const token = localStorage.getItem("token");
    if (!token) window.location.href = "login.html";

    function getDashboardUrl(role) {
      const dashboards = { admin: "admin.html", manager: "manager.html", user: "user.html" };
      return dashboards[role] || "user.html";
    }

    document.getElementById("dashboardBtn").onclick = () => {
      window.location.href = getDashboardUrl(role);
    };

    async function loadDocuments() {
      const response = await fetch("/api/documents", {
        headers: { "Authorization": `Bearer ${token}` }
      });
      const data = await response.json();
      
      const tbody = document.getElementById("documentsList");
      tbody.innerHTML = data.documents.map(doc => `
        <tr>
          <td>${doc.original_name}</td>
          <td>${new Date(doc.uploaded_at).toLocaleString()}</td>
          <td>
            <button class="btn-edit" onclick="download(${doc.id})">Download</button>
            <button class="btn-delete" onclick="deleteDoc(${doc.id})">Delete</button>
          </td>
        </tr>
      `).join("");
    }

    async function download(id) {
      const response = await fetch(`/api/documents/download/${id}`, {
        headers: { "Authorization": `Bearer ${token}` }
      });
      const blob = await response.blob();
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "document";
      a.click();
    }

    async function deleteDoc(id) {
      if (!confirm("Delete this document?")) return;
      await fetch(`/api/documents/${id}`, {
        method: "DELETE",
        headers: { "Authorization": `Bearer ${token}` }
      });
      loadDocuments();
    }

    loadDocuments();
  </script>
</body>
</html>
