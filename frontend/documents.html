<!DOCTYPE html>
<html>
<head>
  <title>My Documents</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .table-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .table-header h3 {
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="dashboard-container">
    <div class="dashboard-header">
      <h2>My Documents</h2>
      <p>View and manage your uploaded documents</p>
    </div>
    
    <div class="table-header">
      <h3>Document List</h3>
      <span id="docCount" style="color: var(--text-light); font-size: 14px;"></span>
    </div>
    
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Filename</th>
          <th>Uploaded</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="documentsList"></tbody>
    </table>
    <div id="verifyResult" style="margin: 20px 0;"></div>
    <div class="buttons-row" id="buttonsContainer">
      <button onclick="window.location.href='verify.html'">Verify Documents</button>
      <button class="secondary" id="dashboardBtn">Dashboard</button>
      <button class="back-btn" onclick="logout()">Logout</button>
    </div>
  </div>
  <script>
    const role = localStorage.getItem("role");
    const token = localStorage.getItem("token");
    if (!token) window.location.href = "login.html";

    function getDashboardUrl(role) {
      const dashboards = { admin: "admin.html", manager: "manager.html", user: "user.html" };
      return dashboards[role] || "user.html";
    }

    document.getElementById("dashboardBtn").onclick = () => {
      window.location.href = getDashboardUrl(role);
    };

    if (role === "user") {
      const uploadBtn = document.createElement("button");
      uploadBtn.textContent = "Upload New";
      uploadBtn.onclick = () => window.location.href = "upload.html";
      document.getElementById("buttonsContainer").prepend(uploadBtn);
    }

    async function loadDocuments() {
      const response = await fetch("/api/documents", {
        headers: { "Authorization": `Bearer ${token}` }
      });
      const data = await response.json();
      
      const tbody = document.getElementById("documentsList");
      document.getElementById("docCount").textContent = `${data.documents.length} document(s)`;
      
      tbody.innerHTML = data.documents.length === 0 
        ? '<tr><td colspan="4" style="text-align: center; color: var(--text-light); padding: 40px;">No documents found</td></tr>'
        : data.documents.map((doc, index) => `
          <tr>
            <td>${index + 1}</td>
            <td><strong>${doc.original_name}</strong></td>
            <td>${new Date(doc.uploaded_at).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' })}</td>
            <td>
              <button class="btn-edit" onclick="verifyDoc(${doc.id})">Verify</button>
              ${role !== "manager" ? `<button class="btn-download" onclick="download(${doc.id})">Download</button>` : ""}
              <button class="btn-delete" onclick="deleteDoc(${doc.id})">Delete</button>
            </td>
          </tr>
        `).join("");
    }

    async function verifyDoc(id) {
      const response = await fetch(`/api/documents/verify/${id}`, {
        headers: { "Authorization": `Bearer ${token}` }
      });
      const data = await response.json();
      
      if (!response.ok) {
        document.getElementById("verifyResult").innerHTML = `<p style="color: var(--danger);">${data.message}</p>`;
        return;
      }
      
      document.getElementById("verifyResult").innerHTML = `
        <div class="user-info">
          <h3>Document: ${data.document.original_name}</h3>
          <p><strong>Uploaded by:</strong> ${data.document.user_name || "N/A"}</p>
          <p><strong>Upload Date:</strong> ${new Date(data.document.uploaded_at).toLocaleString('en-US', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })}</p>
          <hr style="margin: 20px 0; border: none; border-top: 1px solid var(--border);">
          <h3>Integrity Check (SHA-256)</h3>
          <p><strong>Hash Match:</strong> <span style="color: ${data.integrity.hashMatch ? '#2ecc71' : 'var(--danger)'}">${data.integrity.hashMatch ? 'VALID' : 'INVALID'}</span></p>
          <p><strong>Current Hash:</strong></p>
          <code style="word-break: break-all; font-size: 11px; background: #f8f9fa; padding: 10px; display: block; border-radius: 8px;">${data.integrity.currentHash}</code>
          <p style="margin-top: 12px;"><strong>Stored Hash:</strong></p>
          <code style="word-break: break-all; font-size: 11px; background: #f8f9fa; padding: 10px; display: block; border-radius: 8px;">${data.integrity.storedHash}</code>
          <hr style="margin: 20px 0; border: none; border-top: 1px solid var(--border);">
          <h3>Digital Signature</h3>
          <p><strong>Signature Valid:</strong> <span style="color: ${data.signature.valid ? '#2ecc71' : 'var(--danger)'}">${data.signature.valid ? 'VALID' : 'INVALID'}</span></p>
          <button onclick="document.getElementById('verifyResult').innerHTML=''" style="margin-top:16px;">Close</button>
        </div>
      `;
    }

    async function download(id) {
      const response = await fetch(`/api/documents/download/${id}`, {
        headers: { "Authorization": `Bearer ${token}` }
      });
      const blob = await response.blob();
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "document";
      a.click();
    }

    async function deleteDoc(id) {
      if (!confirm("Are you sure you want to delete this document?")) return;
      await fetch(`/api/documents/${id}`, {
        method: "DELETE",
        headers: { "Authorization": `Bearer ${token}` }
      });
      loadDocuments();
    }

    function logout() {
      localStorage.removeItem("token");
      localStorage.removeItem("userId");
      localStorage.removeItem("role");
      localStorage.removeItem("name");
      window.location.href = "login.html";
    }

    loadDocuments();
  </script>
</body>
</html>
