<!DOCTYPE html>
<html>
<head>
  <title>Register</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .password-requirements {
      margin-top: 16px;
      font-size: 13px;
      background: #f8f9fa;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }
    .requirement {
      color: var(--text-light);
      margin: 8px 0;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.3s;
    }
    .requirement.met {
      color: #2ecc71;
    }
    .requirement::before {
      content: "";
      width: 20px;
      height: 20px;
      border: 2px solid var(--text-light);
      border-radius: 50%;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .requirement.met::before {
      content: "✓";
      background: #2ecc71;
      border-color: #2ecc71;
      color: white;
      font-size: 12px;
      font-weight: bold;
    }
    .qr-section {
      text-align: center;
      margin-top: 32px;
      padding-top: 32px;
      border-top: 1px solid var(--border);
    }
    .qr-section h3 {
      margin-top: 0;
      margin-bottom: 16px;
    }
    .qr-note {
      font-size: 13px;
      color: var(--text-light);
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Create Account</h2>
    <p class="subtitle">Join us and secure your documents</p>
    <form id="registerForm">
      <div class="form-group">
        <label for="name">Full Name</label>
        <div class="input-wrapper">
          <input type="text" id="name" placeholder="Enter your full name" required>
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        </div>
      </div>
      <div class="form-group">
        <label for="email">Email Address</label>
        <div class="input-wrapper">
          <input type="email" id="email" placeholder="Enter your email" required>
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
        </div>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <input type="password" id="password" placeholder="Create a strong password" required>
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
        </div>
        <div class="password-requirements">
          <div class="requirement" id="req-length">At least 8 characters</div>
          <div class="requirement" id="req-upper">Capital letter (A-Z)</div>
          <div class="requirement" id="req-lower">Small letter (a-z)</div>
          <div class="requirement" id="req-number">Number (0-9)</div>
          <div class="requirement" id="req-special">Special character (* / @)</div>
        </div>
      </div>
      <div class="form-group">
        <label for="role">Select Role</label>
        <select id="role">
          <option value="user">User</option>
          <option value="manager">Manager</option>
          <option value="admin">Admin</option>
        </select>
      </div>
      <button type="submit">Create Account</button>
    </form>
    
    <div class="divider"><span>or register with</span></div>
    
    <a href="google-register.html">
      <button type="button" class="oauth">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        Continue with Google
      </button>
    </a>
    
    <a href="github-register.html">
      <button type="button" class="oauth">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="#333"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
        Continue with GitHub
      </button>
    </a>
    
    <div class="qr-section">
      <h3>Scan QR Code for 2FA</h3>
      <img id="qr" alt="2FA QR Code">
      <p class="qr-note">After registration, scan this with Google Authenticator</p>
    </div>
    
    <p class="link">Already have an account? <a href="login.html">Sign in</a></p>
  </div>
  <script src="js/register.js"></script>
</body>
</html>
