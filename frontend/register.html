<!DOCTYPE html>
<html>
<head>
  <title>Register</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .password-requirements {
      margin-top: 10px;
      font-size: 12px;
    }
    .requirement {
      color: #999;
      margin: 5px 0;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: color 0.3s;
    }
    .requirement.met {
      color: green;
    }
    .requirement::before {
      content: "○";
      font-size: 14px;
    }
    .requirement.met::before {
      content: "✓";
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Register</h2>
    <form id="registerForm">
      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" placeholder="Enter your name" required>
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Enter your email" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" required>
        <div class="password-requirements">
          <div class="requirement" id="req-length">At least 8 characters</div>
          <div class="requirement" id="req-upper">Capital letter (A-Z)</div>
          <div class="requirement" id="req-lower">Small letter (a-z)</div>
          <div class="requirement" id="req-number">Number (0-9)</div>
          <div class="requirement" id="req-special">Special character (* / @)</div>
        </div>
      </div>
      <div class="form-group">
        <label for="role">Role</label>
        <select id="role">
          <option value="user">User</option>
          <option value="manager">Manager</option>
          <option value="admin">Admin</option>
        </select>
      </div>
      <button type="submit">Register</button>
    </form>
    
    <div style="text-align: center; margin: 20px 0;">
      <span style="color: #999;">or</span>
    </div>
    
    <a href="google-register.html">
      <button type="button" class="secondary" style="background: #4285f4; color: white;">
        Register with Google
      </button>
    </a>
    
    <a href="github-register.html">
      <button type="button" class="secondary" style="background: #333; color: white;">
        Register with GitHub
      </button>
    </a>
    
    <h3>Scan QR Code:</h3>
    <img id="qr" />
    <p class="link">Already have an account? <a href="login.html">Login</a></p>
  </div>
  <script src="js/register.js"></script>
</body>
</html>
