<!DOCTYPE html>
<html>
<head>
  <title>Profile</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="dashboard-container">
    <div class="dashboard-header">
      <h2>Profile</h2>
    </div>
    
    <div id="profileData" class="user-info"></div>
    
    <div class="buttons-row">
      <button id="dashboardBtn">Dashboard</button>
      <button class="back-btn" onclick="logout()">Logout</button>
    </div>
  </div>

  <script>
    const token = localStorage.getItem("token");
    const role = localStorage.getItem("role");

    const dashboards = { user: "user.html", admin: "admin.html", manager: "manager.html" };
    document.getElementById("dashboardBtn").onclick = () => {
      window.location.href = dashboards[role] || "login.html";
    };

    async function loadProfile() {
      const res = await fetch("/api/auth/profile", {
        headers: { "Authorization": "Bearer " + token }
      });
      const data = await res.json();
      
      if (!res.ok) {
        window.location.href = "login.html";
        return;
      }
      
      document.getElementById("profileData").innerHTML = `
        <p><strong>ID:</strong> ${data.user.id}</p>
        <p><strong>Name:</strong> ${data.user.name}</p>
        <p><strong>Email:</strong> ${data.user.email}</p>
        <p><strong>Role:</strong> ${data.user.role}</p>
      `;
    }

    function logout() {
      localStorage.removeItem("token");
      localStorage.removeItem("userId");
      localStorage.removeItem("role");
      window.location.href = "login.html";
    }

    loadProfile();
  </script>
</body>
</html>
